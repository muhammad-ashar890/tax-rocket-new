<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Iris Dashboard</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8faf7; color: #13211b; margin: 0; }
      .shell { max-width: 1080px; margin: 48px auto; background: white; border: 1px solid #d8cebd; border-radius: 8px; padding: 32px; }
      .top { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
      .status { padding: 8px 12px; border-radius: 999px; background: #0b5d3b0d; color: #0b5d3b; border: 1px solid #0b5d3b33; font-size: 13px; font-weight: 700; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
      .card { border: 1px solid #d8cebd; border-radius: 8px; padding: 16px; }
      button { margin-top: 24px; background: #0b5d3b; color: white; border: 0; border-radius: 8px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="top">
        <div>
          <h1 id="iris-dashboard-ready">Iris dashboard</h1>
          <p>Trusted local session is ready. The dry-run worker will only continue when this screen is visible.</p>
        </div>
        <div class="status">Session ready</div>
      </div>
      <div class="grid">
        <div class="card">Return preparation</div>
        <div class="card">Wealth statement</div>
        <div class="card" id="completed-tasks-proof">Completed Tasks</div>
      </div>
      <button id="open-return-dry-run" type="button">Open prepared return</button>
    </main>
    <script>
      document.querySelector("#open-return-dry-run").addEventListener("click", () => {
        window.location.href = "./return.html";
      });
    </script>
  </body>
</html>
