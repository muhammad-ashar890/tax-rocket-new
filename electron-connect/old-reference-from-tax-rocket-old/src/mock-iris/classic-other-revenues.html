<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock IRIS Classic — Other Revenues (Code 3404)</title>
    <style>
      body { font-family: Arial, sans-serif; background: #eef2f6; color: #13211b; margin: 0; }
      .layout { display: flex; min-height: 100vh; }
      .tree-panel {
        width: 260px; background: #1a3a2a; color: #e8f0e6; padding: 12px 0;
        border-right: 2px solid #0b5d3b; overflow-y: auto;
      }
      .tree-panel ul { list-style: none; margin: 0; padding: 0; }
      .tree-panel .panel-header {
        display: block; padding: 12px 16px; font-weight: 700; cursor: pointer;
        color: #c8e0c0; text-decoration: none; font-size: 14px;
      }
      .tree-panel .panel-header.active { background: #0b5d3b; color: #fff; }
      .tree-panel .sub-items { list-style: none; margin: 0; padding: 0; background: #0d2d1d; }
      .tree-panel .sub-items li a {
        display: block; padding: 10px 16px 10px 32px; color: #b0d0a0;
        text-decoration: none; font-size: 13px;
      }
      .tree-panel .sub-items li a.active { background: #1a5a3a; color: #fff; font-weight: 700; }
      .main-content { flex: 1; padding: 24px; overflow-y: auto; }
      .toolbar {
        display: flex; gap: 8px; margin-bottom: 16px; padding: 8px;
        background: #f0f4f0; border: 1px solid #d8cebd; border-radius: 6px;
      }
      .toolbar button { padding: 8px 16px; border-radius: 4px; border: 1px solid #999; cursor: pointer; font-weight: 600; }
      .btn-save { background: #0b5d3b; color: #fff; border-color: #0b5d3b; }
      .section-label { font-size: 16px; font-weight: 700; margin: 16px 0 8px; color: #0b5d3b; }
      table.ui-datatable { width: 100%; border-collapse: collapse; border: 1px solid #ccc; }
      table.ui-datatable th { background: #e8ece8; padding: 10px; border: 1px solid #ccc; text-align: left; font-size: 13px; }
      table.ui-datatable td { padding: 8px 10px; border: 1px solid #ddd; }
      table.ui-datatable input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 3px; }
      .add-row-btn { margin-top: 8px; padding: 6px 14px; background: #1a6fb5; color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav class="tree-panel">
        <ul>
          <li><a class="panel-header active" href="classic-other-revenues.html">Business</a></li>
          <li><a class="panel-header" href="#">Tax Chargeable</a></li>
          <li><a class="panel-header" href="classic-wealth-statement.html">Wealth Statement</a></li>
        </ul>
        <ul class="sub-items">
          <li><a class="active" href="classic-other-revenues.html">Other Revenues</a></li>
          <li><a href="#">Business Assets</a></li>
        </ul>
      </nav>

      <div class="main-content" id="correspondenceTabs:returnAmountForm:data">
        <div class="toolbar">
          <button class="btn-save" id="correspondence:btnSave">Save</button>
        </div>
        <div class="section-label">Business → Other Revenues</div>
        <p>Enter export proceeds and other revenue. Section 154A export-of-services final tax applies to Code 3404.</p>

        <table class="ui-datatable">
          <thead>
            <tr>
              <th>#</th>
              <th>Description / Code</th>
              <th>Total Amount</th>
              <th>Amount Exempt</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Row 0: Export of IT services (Code 3404) — Phase 16 classic fields -->
            <tr>
              <td>1</td>
              <td>
                <input type="text" value="Export of IT services – Code 3404" readonly style="background:#f5f5f5; font-size:12px;" />
              </td>
              <td>
                <!-- classic.other_revenues.total_amount — Phase 15.5a F1: field.selector target -->
                <input type="text" id="correspondenceTabs:returnAmountForm:data:0:total"
                       placeholder="Enter export proceeds (PKR)" />
              </td>
              <td>
                <!-- classic.other_revenues.exempt_amount -->
                <input type="text" id="correspondenceTabs:returnAmountForm:data:0:exempt"
                       placeholder="Amount exempt (same as total for 154A)" />
              </td>
              <td><button style="color:#a83232; border:0; background:none; cursor:pointer;">✕</button></td>
            </tr>
          </tbody>
        </table>
        <button class="add-row-btn" onclick="alert('Add row — Phase 15.5a G27: agent must handle this pattern')">+ Add Row</button>
      </div>
    </div>
  </body>
</html>
