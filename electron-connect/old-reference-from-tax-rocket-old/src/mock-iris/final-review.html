<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Iris Final Review</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8faf7; color: #13211b; margin: 0; }
      .shell { max-width: 920px; margin: 48px auto; background: white; border: 1px solid #d8cebd; border-radius: 8px; padding: 32px; }
      .flag { display: inline-block; padding: 8px 12px; border-radius: 999px; border: 1px solid #a8323266; color: #a83232; background: #a8323212; font-weight: 700; }
      button { margin-top: 18px; border: 0; border-radius: 8px; padding: 12px 18px; font-weight: 700; cursor: pointer; background: #a83232; color: white; }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="flag" id="iris-final-submit-gate">Final submit confirmation gate</div>
      <h1>Final declaration</h1>
      <p>The user must confirm the final declaration locally before the proof-capture stage can continue.</p>
      <button id="final-submit" type="button">Final Submit</button>
    </main>
  </body>
</html>
