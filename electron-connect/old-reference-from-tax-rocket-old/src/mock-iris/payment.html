<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Iris Payment</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8faf7; color: #13211b; margin: 0; }
      .shell { max-width: 920px; margin: 48px auto; background: white; border: 1px solid #d8cebd; border-radius: 8px; padding: 32px; }
      .flag { display: inline-block; padding: 8px 12px; border-radius: 999px; border: 1px solid #b8872f66; color: #8a641f; background: #b8872f12; font-weight: 700; }
      .box { margin-top: 20px; border: 1px solid #d8cebd; border-radius: 8px; padding: 18px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="flag" id="iris-payment-gate">PSID / Payment pause</div>
      <h1>Payment confirmation required</h1>
      <p>Use this stage to create the PSID or complete the payment locally before continuing.</p>
      <div class="box" id="mock-cpr-reference">CPR / payment proof will be captured after this step completes.</div>
    </main>
  </body>
</html>
