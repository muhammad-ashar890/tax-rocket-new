<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock IRIS Classic — Attributes (Business Sector, Residence)</title>
    <style>
      body { font-family: Arial, sans-serif; background: #eef2f6; color: #13211b; margin: 0; }
      .layout { display: flex; min-height: 100vh; }
      .tree-panel {
        width: 260px; background: #1a3a2a; color: #e8f0e6; padding: 12px 0;
        border-right: 2px solid #0b5d3b; overflow-y: auto;
      }
      .tree-panel ul { list-style: none; margin: 0; padding: 0; }
      .tree-panel .panel-header {
        display: block; padding: 12px 16px; font-weight: 700; cursor: pointer;
        color: #c8e0c0; text-decoration: none; font-size: 14px;
      }
      .tree-panel .panel-header.active { background: #0b5d3b; color: #fff; }
      .tree-panel .sub-items { list-style: none; margin: 0; padding: 0; background: #0d2d1d; }
      .tree-panel .sub-items li a {
        display: block; padding: 10px 16px 10px 32px; color: #b0d0a0;
        text-decoration: none; font-size: 13px;
      }
      .tree-panel .sub-items li a.active { background: #1a5a3a; color: #fff; font-weight: 700; }
      .main-content { flex: 1; padding: 24px; overflow-y: auto; }
      .toolbar {
        display: flex; gap: 8px; margin-bottom: 16px; padding: 8px;
        background: #f0f4f0; border: 1px solid #d8cebd; border-radius: 6px;
      }
      .toolbar button { padding: 8px 16px; border-radius: 4px; border: 1px solid #999; cursor: pointer; font-weight: 600; }
      .btn-save { background: #0b5d3b; color: #fff; border-color: #0b5d3b; }
      .section-label { font-size: 16px; font-weight: 700; margin: 16px 0 8px; color: #0b5d3b; }
      .field-group { border: 1px solid #d8cebd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
      .field-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
      .field-group select, .field-group input {
        width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav class="tree-panel">
        <ul>
          <li><a class="panel-header" href="classic-other-revenues.html">Business</a></li>
          <li><a class="panel-header" href="classic-fixed-final-tax.html">Tax Chargeable</a></li>
          <li><a class="panel-header" href="classic-wealth-statement.html">Wealth Statement</a></li>
          <li><a class="panel-header active" href="classic-attributes.html">Attributes</a></li>
        </ul>
        <ul class="sub-items">
          <li><a class="active" href="classic-attributes.html">Business Sector / Residence</a></li>
        </ul>
      </nav>

      <div class="main-content">
        <div class="toolbar">
          <button class="btn-save" id="correspondence:btnSave">Save</button>
        </div>
        <div class="section-label">Attributes Tab</div>
        <p>Configure taxpayer attributes for the return. These are required before submission.</p>

        <!-- Business Sector (FBR23) — dropdown, searchable -->
        <div class="field-group">
          <label for="attributes_business_sector">Business Sector / Principal Business Activity</label>
          <select id="attributes_business_sector">
            <option value="">-- Select Business Sector --</option>
            <option value="exporter_it" selected>Exporter – Information Technology</option>
            <option value="exporter_textile">Exporter – Textile</option>
            <option value="manufacturer">Manufacturer</option>
            <option value="trader">Trader / Distributor</option>
            <option value="service_provider">Service Provider (Non-IT)</option>
            <option value="professional">Professional Services</option>
            <option value="other">Other</option>
          </select>
        </div>

        <!-- Residence Status (FBR23) — dropdown -->
        <div class="field-group">
          <label for="attributes_residence_status">Residence Status</label>
          <select id="attributes_residence_status">
            <option value="">-- Select Residence Status --</option>
            <option value="resident" selected>Resident</option>
            <option value="non_resident">Non-Resident</option>
          </select>
        </div>

        <!-- Business Activity Code (remote) — G26 -->
        <div class="field-group">
          <label for="attributes_bus_activity_remote">Business Activity (Remote Code)</label>
          <input type="text" id="attributes_bus_activity_remote" value="6201 — IT Consulting / Software Export" readonly style="background:#f5f5f5;" />
        </div>
      </div>
    </div>
  </body>
</html>
