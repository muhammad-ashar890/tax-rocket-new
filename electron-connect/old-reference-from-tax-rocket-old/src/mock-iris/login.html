<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Iris Login</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8faf7; color: #13211b; margin: 0; }
      .shell { max-width: 960px; margin: 48px auto; background: white; border: 1px solid #d8cebd; border-radius: 8px; padding: 32px; }
      .badge { display: inline-block; padding: 6px 10px; border-radius: 999px; border: 1px solid #0b5d3b33; color: #0b5d3b; background: #0b5d3b0d; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      h1 { margin: 16px 0 8px; font-size: 32px; }
      p { color: #4b5b54; line-height: 1.6; }
      .field { margin-top: 16px; }
      label { display: block; margin-bottom: 8px; font-weight: 700; }
      input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #d8cebd; }
      button { margin-top: 24px; background: #0b5d3b; color: white; border: 0; border-radius: 8px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main class="shell">
      <span class="badge">Mock Iris</span>
      <h1 id="iris-login-screen">Login</h1>
      <p>This fixture stands in for the local Iris login. The user still performs the sign-in step on the desktop side.</p>
      <div class="field">
        <label for="ntn">NTN / CNIC</label>
        <input id="ntn" autocomplete="off" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="off" />
      </div>
      <button id="mock-login-submit" type="button">Continue to dashboard</button>
    </main>
    <script>
      document.querySelector("#mock-login-submit").addEventListener("click", () => {
        window.location.href = "./dashboard.html";
      });
    </script>
  </body>
</html>
