<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Iris Completed</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8faf7; color: #13211b; margin: 0; }
      .shell { max-width: 980px; margin: 48px auto; background: white; border: 1px solid #d8cebd; border-radius: 8px; padding: 32px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
      .card { border: 1px solid #d8cebd; border-radius: 8px; padding: 16px; }
      .ok { display: inline-block; padding: 8px 12px; border-radius: 999px; border: 1px solid #0b5d3b33; color: #0b5d3b; background: #0b5d3b0d; font-weight: 700; }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="ok">Submission proof available</div>
      <h1 id="completed-tasks-proof">Completed Tasks</h1>
      <p>The desktop worker captures this page and the related proof surfaces for support review.</p>
      <div class="grid">
        <div class="card" id="iris-acknowledgement-proof">Acknowledgement</div>
        <div class="card" id="iris-return-copy-proof">Return copy</div>
        <div class="card" id="iris-cpr-proof">CPR screenshot</div>
        <div class="card">Submission reference</div>
      </div>
    </main>
  </body>
</html>
