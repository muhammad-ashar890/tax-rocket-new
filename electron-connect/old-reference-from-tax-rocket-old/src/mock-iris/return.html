<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Iris Return</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8faf7; color: #13211b; margin: 0; }
      .shell { max-width: 1180px; margin: 32px auto; background: white; border: 1px solid #d8cebd; border-radius: 8px; padding: 32px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .field { border: 1px solid #d8cebd; border-radius: 8px; padding: 14px; }
      label { display: block; margin-bottom: 8px; font-weight: 700; }
      input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #d8cebd; }
      .review { margin-top: 24px; border: 1px solid #b8872f66; background: #b8872f12; border-radius: 8px; padding: 18px; }
      button { margin-top: 18px; border: 0; border-radius: 8px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
      #dry-run-review-gate { background: #0b5d3b; color: white; }
      #final-submit { background: #a83232; color: white; }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Prepared return dry run</h1>
      <p>This fixture receives the approved packet values and stops before final submit.</p>

      <div class="grid">
        <div class="field">
          <label>Tax year</label>
          <input data-tax-field-key="return.tax_year" />
        </div>
        <div class="field">
          <label>Residency status</label>
          <input data-tax-field-key="return.residency_status" />
        </div>
        <div class="field">
          <label>Salary income</label>
          <input data-tax-field-key="return.salary_income" />
        </div>
        <div class="field">
          <label>Bank profit income</label>
          <input data-tax-field-key="return.bank_profit_income" />
        </div>
        <div class="field">
          <label>Salary tax deducted</label>
          <input data-tax-field-key="return.salary_tax_deducted" />
        </div>
        <div class="field">
          <label>Advance tax paid</label>
          <input data-tax-field-key="return.advance_tax_paid" />
        </div>
        <div class="field">
          <label>Tax liability</label>
          <input data-tax-field-key="return.tax_liability" />
        </div>
        <div class="field">
          <label>Tax payable</label>
          <input data-tax-field-key="return.tax_payable" />
        </div>
        <div class="field">
          <label>Refund due</label>
          <input data-tax-field-key="return.refund_due" />
        </div>
        <div class="field">
          <label>Opening wealth</label>
          <input data-tax-field-key="wealth.opening_wealth" />
        </div>
        <div class="field">
          <label>Closing wealth</label>
          <input data-tax-field-key="wealth.closing_wealth" />
        </div>
        <div class="field">
          <label>Assets</label>
          <input data-tax-field-key="wealth.assets" />
        </div>
        <div class="field">
          <label>Liabilities</label>
          <input data-tax-field-key="wealth.liabilities" />
        </div>
        <div class="field">
          <label>Cash and bank balance</label>
          <input data-tax-field-key="wealth.cash_bank_balance" />
        </div>
      </div>

      <section class="review">
        <strong>Dry-run review gate</strong>
        <p>Values are filled. The worker can capture this state, but the final submit button must stay untouched.</p>
        <button id="dry-run-review-gate" type="button">Review prepared values</button>
        <button id="final-submit" type="button">Final Submit</button>
      </section>
    </main>
  </body>
</html>
