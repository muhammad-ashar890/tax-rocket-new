<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock IRIS Classic — Declaration / PIN Entry</title>
    <style>
      body { font-family: Arial, sans-serif; background: #eef2f6; color: #13211b; margin: 0; }
      .overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        display: flex; align-items: center; justify-content: center;
      }
      .dialog {
        background: #fff; border-radius: 10px; padding: 32px; max-width: 480px; width: 90%;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center;
      }
      .dialog h2 { color: #0b5d3b; margin: 0 0 8px; }
      .dialog p { color: #555; font-size: 14px; margin: 0 0 20px; }
      .pin-input { margin: 16px 0; }
      .pin-input input {
        width: 200px; padding: 12px; font-size: 20px; text-align: center;
        letter-spacing: 8px; border: 2px solid #0b5d3b; border-radius: 6px;
      }
      .dialog .actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
      .btn-submit { background: #0b5d3b; color: #fff; border: 0; border-radius: 6px; padding: 10px 24px; font-weight: 700; cursor: pointer; }
      .btn-cancel { background: #eee; color: #333; border: 1px solid #ccc; border-radius: 6px; padding: 10px 24px; font-weight: 600; cursor: pointer; }
      .declaration { background: #f8f4e8; border: 1px solid #d8cebd; border-radius: 6px; padding: 12px; margin: 16px 0; font-size: 13px; text-align: left; }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="dialog" id="pin-dialog">
        <h2>Declaration &amp; PIN Entry</h2>
        <div class="declaration">
          <p><strong>I solemnly declare</strong> that the information provided in this return is true and correct to the best of my knowledge and belief. I understand that any false statement may result in penalties under the Income Tax Ordinance, 2001.</p>
        </div>
        <p>Enter your 4-digit FBR PIN to confirm submission:</p>
        <div class="pin-input">
          <!-- FBR25: Classic portal PIN entry -->
          <input type="password" id="fbr-pin-input" maxlength="4" placeholder="••••" autocomplete="off" />
        </div>
        <div class="actions">
          <button class="btn-cancel" id="pin-cancel">Cancel</button>
          <button class="btn-submit" id="pin-submit">Submit Return</button>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('pin-submit').addEventListener('click', () => {
        const pin = document.getElementById('fbr-pin-input').value;
        if (pin.length === 4 && /^\d{4}$/.test(pin)) {
          alert('Phase 15.5a G24: PIN accepted (mock).\n\nAgent must handle this PIN entry pause for classic portal.\nReal portal validates PIN server-side and returns rule engine errors if applicable.');
        } else {
          alert('Please enter a valid 4-digit PIN.');
        }
      });
      document.getElementById('pin-cancel').addEventListener('click', () => {
        window.history.back();
      });
    </script>
  </body>
</html>
